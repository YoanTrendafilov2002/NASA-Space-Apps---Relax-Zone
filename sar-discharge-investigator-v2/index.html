<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAR Discharge Investigator — Dancing with the SARs</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#e2e6eb;
  --accent:#1f5fae; --accent-soft:#e7effa; --ok:#1e7a4c; --ok-soft:#e5f4ec;
  --warn:#9a6200; --warn-soft:#fdf3df; --bad:#b3261e; --bad-soft:#fbe9e7;
  --unk:#5d6b7a; --unk-soft:#eef0f3; --anom:#ff2d7a;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,select,input{font:inherit}
header{height:56px;display:flex;align-items:center;gap:20px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
nav.steps{display:flex;gap:4px;flex:1;justify-content:center}
nav.steps button{border:0;background:transparent;padding:8px 12px;border-radius:999px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
nav.steps button .n{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--unk-soft);font-size:12px;font-weight:600}
nav.steps button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.steps button.active .n{background:var(--accent);color:#fff}
nav.steps button.done .n{background:var(--ok);color:#fff}
nav.steps .sep{color:#c3cad3;align-self:center}
.mode{font-size:12px;color:var(--muted);white-space:nowrap}
main{position:absolute;top:56px;bottom:0;left:0;right:0;display:flex}
#side{width:390px;min-width:390px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 16px 40px}
#mapWrap{flex:1;position:relative}
#map{position:absolute;inset:0}
#page{flex:1;overflow-y:auto;padding:24px 32px 60px;display:none}
.wide #side,.wide #mapWrap{display:none}
.wide #page{display:block}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:14px;margin:18px 0 8px}
p.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card.click{cursor:pointer}
.card.click:hover{border-color:#b9c6d6}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
select,input[type=text],input[type=date]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#b9c6d6}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-sup{background:var(--ok-soft);color:var(--ok)} .b-con{background:var(--warn-soft);color:var(--warn)}
.b-unl{background:var(--bad-soft);color:var(--bad)} .b-unk{background:var(--unk-soft);color:var(--unk)}
.b-info{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.state{padding:10px 12px;border-radius:8px;font-size:12.5px;margin:8px 0}
.state.loading{background:var(--accent-soft);color:var(--accent)}
.state.empty{background:var(--unk-soft);color:var(--muted)}
.state.error{background:var(--bad-soft);color:var(--bad)}
.state.warn{background:var(--warn-soft);color:var(--warn)}
.state.ok{background:var(--ok-soft);color:var(--ok)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.list .it{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:#f7f9fb}
.list .it.sel{background:var(--accent-soft)}
.tabs{display:flex;gap:4px;margin:8px 0}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;padding:6px;border-radius:8px;cursor:pointer;font-size:12.5px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
details{margin:8px 0}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.tip{border-bottom:1px dotted var(--muted);cursor:help}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:#f8f9fb;font-weight:600;position:sticky;top:0}
.cell-ok{color:var(--ok);font-weight:600}.cell-bad{color:var(--bad);font-weight:600}.cell-unk{color:var(--unk)}
.verdict{border-radius:var(--radius);padding:14px 16px;margin:12px 0;border:1px solid}
.verdict.inc{background:var(--warn-soft);border-color:#ecd39c}
.verdict.neg{background:var(--unk-soft);border-color:var(--line)}
.verdict.pos{background:var(--accent-soft);border-color:#bcd1ee}
.verdict b{font-size:16px}
.verdict .small b{font-size:inherit}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.legend{position:absolute;right:12px;bottom:22px;z-index:500;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;box-shadow:var(--shadow);max-width:250px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.maptools{position:absolute;left:56px;top:12px;z-index:500;display:flex;gap:6px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-size:12.5px;cursor:pointer}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:9999;display:none;max-width:70vw}
.matrix-wrap{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ind-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.ind-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.ind-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ind-tabs button.rel{border-color:var(--accent)}
.report{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 32px;max-width:900px}
.report h1{font-size:20px;margin:0 0 4px}
.report h2{font-size:15px;margin:20px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.report ul{margin:4px 0;padding-left:20px}
code{word-break:break-all;font-size:11.5px;background:#f3f5f8;padding:1px 4px;border-radius:4px}
.ev-sup{color:#1f5fae;font-weight:700}.ev-con{color:var(--ok);font-weight:600}.ev-unt{color:#8a96a3;font-weight:600}.ev-bad{color:var(--bad);font-weight:700}.ev-ctx{color:#8a96a3}.ev-na{color:#c3cad3}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tier{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:12.5px}.tier b{display:block}.tier span{color:var(--muted);font-size:12px}
.tier.on{border-color:var(--accent);background:var(--accent-soft)}.tier.off{background:#f6f6f6;border-style:dashed}
.foot{font-size:11.5px;color:var(--muted);margin-top:18px}
input[type=range]{width:100%}
.slider-val{font-variant-numeric:tabular-nums;font-weight:600}
.legend .sw{display:inline-block;width:60px;height:8px;vertical-align:middle;background:linear-gradient(90deg,#000,#fff);border:1px solid #ccc}
@media print{header,#side,#mapWrap,.noprint{display:none!important} main{position:static} #page{display:block!important;padding:0} .report{border:0;max-width:none}}
@media (max-width:1100px){#side{width:330px;min-width:330px} nav.steps button .lbl{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">SAR Discharge Investigator<small>NASA Space Apps 2026 · Dancing with the SARs</small></div>
  <nav class="steps" id="steps"></nav>
  <div class="mode" id="modeBadge"><span class="badge b-info">Live data</span></div>
</header>
<main id="main">
  <aside id="side"></aside>
  <section id="mapWrap">
    <div id="map"></div>
    <div class="maptools" id="maptools"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section id="page"></section>
</main>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
